=== UNIT 4: CONTINUITY OF LIFE ===
DNA, CHROMOSOMES, AND GENES: Genome = total DNA of an organism. Eukaryotic DNA is partitioned into chromosomes. Chromatin = DNA + histone proteins + non-histone proteins; lower order of DNA organization. Chromosome = condensed form of chromatin; higher order; only visible during nuclear division (M phase), NOT during interphase. Nucleosome = bead = DNA wrapped around histone core (histone has + charge; DNA has - charge). Levels of organization: DNA double helix → nucleosome (beads on string = chromatin) → solenoid → chromatin loops → rosettes → chromosome. Chromosome identification: 3 features = size, banding pattern, centromere position. Centromere types: metacentric (middle), submetacentric (between middle and end), acrocentric (close to end), telocentric (at end). Chromosome arms: p = short arm; q = long arm. Locus (pl. loci) = location/position of a gene on a chromosome. Locus notation: chromosome# + arm + band (e.g., CFTR gene = 7q31.2; MDD serotonin transporter = SLC6A4 on chromosome 17). Homologous chromosomes: same type, same size, same shape, same gene loci (order), paternal + maternal homolog; may have DIFFERENT alleles; 2 per type in diploid. Karyotype = arranged photograph of all chromosomes; human = 46 chromosomes (23 pairs); determined by size, banding pattern, centromere position. Chromosome number abnormalities: Trisomy 21 = Down syndrome (happy/social but impulsive); Turner (45,X) = socially anxious; Klinefelter (47,XXY) = shy, passive; XYY/Jacobs = impulsive, ADHD risk; Cri du chat = 5p deletion, cat-like cry, behavioral problems.

GENE AND ALLELE: Gene = section of DNA encoding genetic information; written in 4-letter code (A,T,G,C); specifies traits and behaviors; one gene - one trait - one locus. Codon = group of 3 nucleotides; each codon = one amino acid. Reading frame = how nucleotide sequence is divided into codons (where you start matters). Gene expression: DNA → mRNA (transcription) → Protein (translation) → Phenotype. Allele = new version of a gene created by mutation; occupies SAME LOCUS as original gene (not a new gene). Wild-type allele = most common in population. Mutant allele = differs from wild-type (does NOT mean harmful). Mutation types: substitution (changes amino acid), insertion (shifts reading frame), deletion (shifts reading frame). Gene symbol = different letters for different genes (X, Y, Z). Allele symbol = same letter with modifier (A, a, A1, A2, A*). Multiple alleles: many possible alleles at one locus (e.g., rabbit coat color C, c^ch, c^h, c); but diploid organism carries only TWO alleles at a time. Genotype = allele combination an organism carries (AA, Aa, AaBb). Phenotype = observable characteristic = Genotype + Environment. Homozygous = two identical alleles (AA, bb). Heterozygous = two different alleles (Aa, Bb). Dominant does NOT mean better/stronger/more common/healthier; Recessive does NOT mean worse/harmful/rare. These terms only describe how alleles interact in a heterozygote.

CELL DIVISION AND CELL CYCLE: Cell cycle = from when cell is created until it divides into two daughter cells. Cell cycle = M phase (dividing) + Interphase (non-dividing). Interphase = G1 + S + G2 (longest part of cell cycle). G1 phase = primary growth; cell increases in size; synthesizes proteins and organelles (mitochondria, ribosomes, ER, Golgi). S phase = DNA replication; each chromosome replicated forming 2 identical sister chromatids joined at centromere by cohesin; histone synthesis also occurs. G2 phase = final preparation for division; synthesis of mitotic proteins (tubulin for microtubules). G0 = resting/non-dividing phase. M phase = Mitosis (nuclear division) + Cytokinesis (cytoplasm division). Sister chromatids = 2 identical copies of one replicated chromosome; joined at centromere by cohesin; each has its own kinetochore. Centromere = constricted region; kinetochore = protein complex at centromere; attaches to kinetochore microtubules. Homologous chromosomes vs sister chromatids: homologs = paternal and maternal copies of same chromosome (may differ in alleles); sister chromatids = identical copies of one chromosome after replication. Mitosis: 1 division, 2 diploid daughters (growth/repair). Meiosis: 2 divisions, 4 haploid daughters (gametes). Sources of genetic variation: independent assortment (2^23 combinations), crossing over, random fertilization.

MITOSIS PHASES IN DETAIL: Spindle apparatus = bipolar cytoskeletal structure; function = separate chromosomes into daughter cells. 3 types of spindle microtubules (MT): (1) Aster MT, (2) Polar/interpolar MT, (3) Kinetochore MT. MT = polymer of tubulin subunits. Centrosome = MTOC (microtubule organizing center); duplicated during S/G2 phase. Prophase: centrosomes move apart; chromatin condenses into chromosomes; spindle begins forming. Prometaphase: centrosomes reach opposite poles; nuclear envelope BREAKS DOWN; kinetochores form; kinetochore MT attach to chromatids; chromosomes move toward equator. Metaphase: chromosomes MOST condensed; align at metaphase plate; bipolar spindle fully established. Anaphase: sister chromatids SEPARATE (pulled to poles by spindle). Telophase: nuclear envelope REFORMS; chromosomes decondense; spindle disassembles. Cytokinesis: animals = cleavage furrow forms (actin ring pinches inward); plants = cell plate forms from vesicles; each daughter cell receives one centrosome. Gene expression active during interphase (G1, G2); decreases dramatically during mitosis when chromosomes are condensed.

REPRODUCTION: Asexual = genetically identical offspring (binary fission, budding, fragmentation, parthenogenesis). Sexual = genetic variation via gametes. Hermaphroditism: simultaneous or sequential. Protogyny = female to male. Protoandry = male to female. Parthenogenesis = unfertilized egg develops; bees: drones haploid.

MENDELIAN GENETICS: Law of Segregation: alleles separate during gamete formation. Law of Independent Assortment: genes on different chromosomes assort independently. Monohybrid 3:1 phenotype, 1:2:1 genotype. Dihybrid 9:3:3:1. Test cross = cross with homozygous recessive to determine genotype.

DOMINANCE TYPES: Complete: one allele fully masks other. Incomplete: blend phenotype (red x white = pink, 1:2:1). Codominance: both expressed simultaneously (ABO blood group AB). Overdominance: heterozygote advantage (sickle cell). ABO: IA and IB codominant, i recessive. A=IAIA/IAi, B=IBIB/IBi, AB=IAIB, O=ii.

NON-MENDELIAN: Polygenic = multiple genes, continuous variation (height, skin color). Pleiotropy = one gene, multiple traits (sickle cell). Epistasis = one gene masks another (coat color). X-linked recessive more common in males (hemophilia, colorblindness). Y-linked = paternal line only. Genomic imprinting = parent-of-origin expression (Prader-Willi/Angelman). Maternal effect = mother genotype determines offspring phenotype.

=== UNIT 5: EVOLUTION AND DIVERSITY ===
EVOLUTION: Darwin: natural selection, common descent. Lamarck: use/disuse (wrong). Natural selection requires: variation, heritability, differential reproductive success. Fitness = reproductive success. Adaptation = heritable trait increasing fitness.

HARDY-WEINBERG: Equilibrium if: large population, random mating, no mutation, no migration, no selection. p+q=1; p^2+2pq+q^2=1. Deviations = evolution occurring.

EVOLUTIONARY FORCES: (1) Mutation = source of new alleles. (2) Genetic drift = chance changes; bottleneck effect, founder effect. (3) Gene flow = migration of alleles. (4) Natural selection = differential reproductive success. Three modes: Directional, Stabilizing, Disruptive.

SPECIATION: Biological Species Concept (Mayr): groups that interbreed and produce fertile offspring. Pre-zygotic barriers: habitat, temporal, behavioral, mechanical, gametic. Post-zygotic: hybrid inviability, sterility, breakdown. Allopatric = geographic isolation. Sympatric = polyploidy, habitat differentiation.

BIODIVERSITY: Term coined Walter Rosen 1986. Popularized E.O. Wilson. Three levels: genetic, species, ecosystem. Hotspots (Norman Myers): high endemism + threatened. Endling = last individual of species. IUCN Red List.

TAXONOMY: Linnaeus binomial nomenclature 1753. Genus species (italicized, genus capitalized). Hierarchy: Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species. Priority rule: first valid name wins. Holotype = reference specimen.

PHYLOGENY/CLADISTICS: Willi Hennig founded cladistics. Tree parts: root, nodes, branches, tips. Monophyletic (clade) = ancestor + ALL descendants. Paraphyletic = ancestor + SOME descendants. Polyphyletic = multiple ancestors. Homologous = common ancestry; analogous = convergent evolution.

DIVERSITY OF LIFE: Origin of life 4 stages: abiotic synthesis of monomers, abiotic synthesis of polymers, origin of self-replicating molecules (RNA world), formation of pre-cells (protocells). Prokaryotes: Bacteria (peptidoglycan cell wall) vs Archaea (no peptidoglycan, extremophiles). Shapes: cocci, bacilli, spirochetes. Protists: first eukaryotes; groups include slime molds, dinoflagellates, diatoms, algae, amoeba, Paramecium, Plasmodium (malaria). Plants: alternation of generations; sporophyte (diploid) dominant in vascular plants; gametophyte dominant in bryophytes (mosses). Fungi: heterotrophs by absorption; hyphae and mycelium; chitin cell walls; mushrooms = reproductive structures; decomposers. Animals: Cambrian explosion ~545 mya; key innovations: true tissues, symmetry, body cavities, coelom. Invertebrate phyla: Porifera (sponges, no tissues), Cnidaria (jellyfish, radial, stinging cells, polyp/medusa), Platyhelminthes (flatworms, acoelomate), Nematoda (roundworms, pseudocoelom), Annelida (segmented worms, true coelom), Mollusca (mantle, radula; gastropods/bivalves/cephalopods), Arthropoda (jointed appendages, chitin exoskeleton, molt; largest phylum), Echinodermata (sea stars, water vascular system, marine only). Vertebrates: jawless fish, cartilaginous fish (sharks), bony fish (Osteichthyes), Amphibia (first land vertebrates), Reptilia (amniotic egg, keratin scales), Aves (birds, feathers, endothermic), Mammalia (hair, mammary glands; Monotremata = platypus/echidna; Marsupialia = pouched; Eutheria = placental). Viruses: genome (DNA or RNA) + capsid; host-specific; lytic cycle (replicate and lyse host) vs lysogenic cycle (integrate as prophage). Viroids: naked circular RNA, infect plants. Prions: misfolded proteins, no nucleic acid; cause BSE/CJD; indestructible.

=== UNIT 6: ECOLOGY ===
LEVELS: Organism, Population, Community, Ecosystem, Biome, Biosphere. Niche: Fundamental = potential range; Realized = actual range (reduced by competition).

BIOMES (terrestrial): Tropical rainforest (high rainfall, most diverse), Savanna (seasonal rainfall), Desert (<30cm/yr), Chaparral (rainy winters/dry summers), Temperate grassland, Temperate deciduous forest, Taiga/Boreal (largest terrestrial biome, conifers), Tundra (permafrost, treeless). Aquatic: Marine (largest overall), Estuaries (high productivity), Freshwater; oligotrophic lakes (nutrient-poor, oxygen-rich) vs eutrophic (nutrient-rich, low oxygen); wetlands (most productive, humans destroyed ~90%).

POPULATION ECOLOGY: Density = number per area. Dispersion: clumped (most common), uniform, random. Survivorship: Type I (late loss, humans), Type II (constant, birds), Type III (early loss, oysters). r-selected: many offspring, little care. K-selected: few offspring, much care. Exponential growth: dN/dt=rN (J-curve). Logistic growth: dN/dt=rN(K-N)/K (S-curve); K=carrying capacity. Density-dependent regulation: competition, predation, disease. Density-independent: climate, disasters.

COMMUNITY ECOLOGY: Competition (-/-), Predation (+/-), Herbivory (+/-), Mutualism (+/+), Commensalism (+/0), Parasitism (+/-), Amensalism (-/0). Competitive exclusion (Gause): two species cannot occupy same niche indefinitely. Batesian mimicry: harmless mimics harmful. Mullerian mimicry: two harmful species resemble each other. Primary succession: bare rock, pioneer species (lichens). Secondary succession: after disturbance, soil present. Coevolution: reciprocal adaptation.

ECOSYSTEM ECOLOGY: 10% rule: only ~10% energy transfers between trophic levels. Carbon cycle: photosynthesis fixes CO2; respiration/decomposition/combustion release CO2. Nitrogen cycle: N2 fixation (Rhizobium), nitrification, denitrification. Phosphorus cycle: weathering, no atmospheric component. Ecosystem services: provisioning, regulating, cultural, supporting.

=== UNIT 7: ANIMAL BEHAVIOR ===
TINBERGEN'S 4 QUESTIONS: (1) Causation/mechanism (proximate), (2) Development/ontogeny (proximate), (3) Function/adaptive value (ultimate), (4) Evolution/phylogeny (ultimate).

INNATE BEHAVIOR: Fixed action patterns (FAPs) = stereotyped, species-specific, triggered by sign stimulus (releaser); once initiated, carried to completion. Examples: goose egg retrieval, stickleback red belly attack, gull chick pecking. fru gene (Drosophila): controls male courtship; expressed only in males; mutant males fail to court; females expressing fru court other females. fosB gene (mice): essential for maternal behavior (nest building, pup retrieval, licking, nursing); activated in preoptic area of hypothalamus by presence of pups; encodes AP-1 transcription factor. Disadvantages: inflexible, vulnerable to exploitation (cuckoo brood parasitism; femme fatale firefly), costly genetic mistakes.

NON-ASSOCIATIVE LEARNING: Habituation = decreased response to repeated harmless stimulus; simplest form of learning. Characteristics: stimulus-specific, spontaneous recovery, dishabituation (new stimulus restores response; rules out sensory adaptation/fatigue), stimulus generalization, stimulus discrimination. Sensitization = increased response after noxious stimulus (opposite of habituation). H3NO (hypoxanthine-3-N-oxide) = alarm pheromone of minnows. Fantz (1964): infants look less at familiar, more at novel = habituation demonstrated.

NEUROSCIENCE: Aplysia californica (Eric Kandel, Nobel 2000). Gill-withdrawal reflex: 24 sensory neurons, 6 motor neurons, serotonergic interneurons. Habituation mechanism: less glutamate released; vesicle depletion + Ca2+ channel inactivation. Sensitization mechanism: tail shock, serotonin, cAMP, PKA, closes K+ channels, more Ca2+ entry, more vesicle fusion, more glutamate. Long-term memory: repeated shocks, CREB-1 transcription factor, new protein synthesis, growth of new synaptic boutons and dendritic spines. LTP (Terje Lomo): NMDA receptor = coincidence detector; AMPA receptors increase; structural changes.

ASSOCIATIVE LEARNING: Classical conditioning (Pavlov): NS+UCS->UCR; NS becomes CS->CR. Extinction: CS without UCS reduces CR (not erasure). Spontaneous recovery, renewal, reinstatement. Operant conditioning (Skinner): Positive reinforcement (add pleasant, UP), Negative reinforcement (remove unpleasant, UP), Positive punishment (add unpleasant, DOWN), Negative punishment (remove pleasant, DOWN).

IMPRINTING: Filial imprinting (Lorenz): critical period; geese 13-16 hours after hatching. Types: filial, sexual, song, olfactory, habitat. Zebra finch: cross-fostered finches sing Bengalese finch song with zebra finch accent. LF neurons = encode syllable morphology = experience-dependent. HF neurons = encode temporal gaps = innate, species-specific. Baby duck syndrome = preference for first system learned.

SEXUAL SELECTION: Intersexual = mate choice (female chooses). Intrasexual = same-sex competition. Good genes hypothesis: ornaments are honest signals of quality. Fisherian runaway: trait and preference coevolve, increasingly exaggerated. Sexy son hypothesis: choose attractive males so sons inherit attractive traits. Mate-choice copying: social learning; copy others' mate choices.

COGNITION: DMTS (Delayed Match-to-Sample): honeybees match colors after delay = working memory and concept formation. Insight learning (Kohler): chimpanzee Sultan stacked boxes to reach banana without trial-and-error.

function getSubsections(topicId) {
  if (topicId === "all") return Object.values(TOPIC_SUBSECTIONS).flat();
  return TOPIC_SUBSECTIONS[topicId] || [];
}

function topicKB(id) { return id === "all" ? KB : (TOPIC_CONTEXT[id] || KB); }

async function callClaude(prompt, system) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 2000,
      system: system || "You are a biology tutor. Answer strictly based on the provided lecture content.",
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await res.json();
  return data.content?.[0]?.text || "Error.";
}

async function genMCQ(topicId, n) {
  const appNote = topicId === "app" ? "Focus on APPLICATION questions: scenario-based, multi-concept integration, real-world examples, and questions requiring reasoning across multiple topics. " : "";
  const text = await callClaude(
    `${appNote}Generate exactly ${n} multiple choice questions from this biology content. Return ONLY valid JSON array, no markdown:\n[{"q":"...","options":{"A":"...","B":"...","C":"...","D":"..."},"answer":"A","section":"topic name","explanation":"brief why"}]\n\nContent:\n${topicKB(topicId)}`,
    "Return only a valid JSON array. No markdown, no explanation."
  );
  try { return JSON.parse(text.replace(/```json|```/g,"").trim()); } catch { return []; }
}

async function genFlashcards(topicId) {
  const text = await callClaude(
    `Generate 10 flashcards from this biology content. Return ONLY valid JSON array:\n[{"front":"term or question","back":"definition or answer"}]\n\nContent:\n${topicKB(topicId)}`,
    "Return only a valid JSON array. No markdown."
  );
  try { return JSON.parse(text.replace(/```json|```/g,"").trim()); } catch { return []; }
}

// ── MCQ PRACTICE ─────────────────────────────────────────────────────────────
function MCQView({ topic, onBack }) {
  const col = TOPIC_COLORS[topic] || "#6366f1";
  const [qs, setQs]         = useState([]);
  const [idx, setIdx]       = useState(0);
  const [sel, setSel]       = useState(null);
  const [score, setScore]   = useState(0);
  const [done, setDone]     = useState(false);
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);

  async function load() {
    setLoading(true); setQs([]); setIdx(0); setSel(null); setScore(0); setDone(false); setResults([]);
    const q = await genMCQ(topic, 10);
    setQs(q); setLoading(false);
  }

  function pick(opt) {
    if (sel) return;
    const q = qs[idx];
    const ok = opt === q.answer;
    setSel(opt);
    if (ok) setScore(s=>s+1);
    setResults(r=>[...r,{ q:q.q, sel:opt, correct:q.answer, ok, explanation:q.explanation }]);
  }

  function next() {
    if (idx+1>=qs.length) setDone(true);
    else { setIdx(i=>i+1); setSel(null); }
  }

  const topicLabel = TOPICS.find(t=>t.id===topic)?.label;
  const q = qs[idx];
  const pct = Math.round((score/10)*100);

  if (loading) return <div style={{ maxWidth:600,margin:"0 auto",padding:"28px 20px" }}><Header title="MCQ Practice" subtitle={topicLabel} color={col} onBack={onBack} /><Spinner msg="Generating 10 questions..." /></div>;

  if (!qs.length) return (
    <div style={{ maxWidth:600, margin:"0 auto", padding:"28px 20px" }}>
      <Header title="MCQ Practice" subtitle={topicLabel} color={col} onBack={onBack} />
      <button className="action-btn" onClick={load} style={{ background:col, color:"#fff", width:"100%" }}>Generate Questions</button>
    </div>
  );

  if (done) return (
    <div style={{ maxWidth:600, margin:"0 auto", padding:"28px 20px" }}>
      <Header title="MCQ Practice" subtitle={topicLabel} color={col} onBack={onBack} />
      <div style={{ textAlign:"center", padding:"24px 0 20px" }}>
        <div style={{ fontSize:48, marginBottom:8 }}>{pct>=80?"🏆":pct>=60?"👍":"📚"}</div>
        <h3 style={{ fontSize:22, margin:"0 0 4px", fontWeight:600 }}>{score}/10 Correct</h3>
        <p style={{ color:"var(--color-text-secondary)", margin:"0 0 20px" }}>{pct}% -- {pct>=80?"Excellent!":pct>=60?"Good work!":"Keep reviewing!"}</p>
      </div>
      <div style={{ display:"flex", gap:10, marginBottom:20 }}>
        <button className="action-btn" onClick={load} style={{ flex:1, background:col, color:"#fff" }}>Try Again</button>
        <button className="action-btn" onClick={onBack} style={{ flex:1, background:"var(--color-background-secondary)", color:"var(--color-text-primary)", border:"0.5px solid var(--color-border-tertiary)" }}>Home</button>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {results.map((r,i)=>(
          <div key={i} style={{ padding:"10px 14px", borderRadius:10, background:r.ok?"#f0fdf4":"#fff7f7", border:`0.5px solid ${r.ok?"#86efac":"#fca5a5"}` }}>
            <div style={{ display:"flex", gap:8 }}><span>{r.ok?"✓":"✗"}</span><span style={{ fontSize:13, flex:1 }}>{r.q}</span></div>
            {!r.ok && <p style={{ fontSize:12, color:"#ef4444", margin:"4px 0 0 22px" }}>Correct: {r.correct}</p>}
            {r.explanation && <p style={{ fontSize:11, color:"var(--color-text-tertiary)", margin:"3px 0 0 22px" }}>{r.explanation}</p>}
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{ maxWidth:600, margin:"0 auto", padding:"28px 20px" }}>
      <Header title="MCQ Practice" subtitle={topicLabel} color={col} onBack={onBack} />
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:"var(--color-text-secondary)", marginBottom:8 }}>
        <span>Question {idx+1} of 10</span><span>Score: {score}/{idx}</span>
      </div>
      <div className="progress-bar" style={{ marginBottom:20 }}>
        <div className="progress-fill" style={{ width:`${(idx/10)*100}%`, background:col }} />
      </div>
      <div style={{ background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:14, padding:"20px 18px", marginBottom:16 }}>
        <p style={{ fontSize:15, fontWeight:500, margin:0, lineHeight:1.6 }}>{q.q}</p>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
        {["A","B","C","D"].map(opt=>{
          let cls = "opt-btn";
          if (sel) { if (opt===q.answer) cls+=" opt-correct"; else if (opt===sel) cls+=" opt-wrong"; }
          return (
            <button key={opt} className={cls} onClick={()=>pick(opt)}>
              <span style={{ fontWeight:600, color:col, minWidth:20, fontSize:13 }}>{opt}</span>
              <span style={{ fontSize:14 }}>{q.options?.[opt] || ""}</span>
            </button>
          );
        })}
      </div>
      {sel && (
        <div style={{ padding:"12px 14px", background:sel===q.answer?"#f0fdf4":"#fff7f7", borderRadius:10, border:`0.5px solid ${sel===q.answer?"#86efac":"#fca5a5"}`, marginBottom:14, fontSize:13 }}>
          <strong style={{ color:sel===q.answer?"#16a34a":"#dc2626" }}>{sel===q.answer?"Correct!":"Incorrect -- answer is "+q.answer}</strong>
          {q.explanation && <p style={{ margin:"4px 0 0", color:"var(--color-text-secondary)" }}>{q.explanation}</p>}
        </div>
      )}
      {sel && <button className="action-btn" onClick={next} style={{ width:"100%", background:col, color:"#fff" }}>{idx+1>=qs.length?"See Results":"Next Question"}</button>}
    </div>
  );
}

// ── FULL EXAM ────────────────────────────────────────────────────────────────
function ExamView({ onBack }) {
  const [phase, setPhase]   = useState("setup");
  const [qs, setQs]         = useState([]);
  const [idx, setIdx]       = useState(0);
  const [answers, setAnswers] = useState({});
  const [loading, setLoading] = useState(false);
  const [showReview, setShowReview] = useState(false);
  const [timer, setTimer]   = useState(0);
  const timerRef            = useRef(null);

  const batches = [
    { id:"u4", n:19 }, { id:"u5", n:29 }, { id:"u6", n:19 }, { id:"u7", n:25 }, { id:"all", n:4 },
  ];

  async function start() {
    setLoading(true); setQs([]); setAnswers({}); setIdx(0); setShowReview(false);
    const all = [];
    for (const b of batches) { const q = await genMCQ(b.id, b.n); all.push(...q); }
    setQs(all); setTimer(0);
    timerRef.current = setInterval(()=>setTimer(s=>s+1), 1000);
    setLoading(false); setPhase("exam");
  }

  function finish() { clearInterval(timerRef.current); setPhase("results"); }
  const fmt = s => `${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;

  if (loading) return <div style={{ maxWidth:500,margin:"0 auto",padding:"80px 20px",textAlign:"center" }}><div style={{ fontSize:36,marginBottom:16 }}>⚙️</div><h3>Generating Exam...</h3><p style={{ color:"var(--color-text-secondary)",fontSize:14 }}>Creating 96 questions from all units. Takes ~2 minutes.</p></div>;

  if (phase==="setup") return (
    <div style={{ maxWidth:500, margin:"0 auto", padding:"28px 20px" }}>
      <button className="back-btn" onClick={onBack} style={{ marginBottom:24 }}>Back</button>
      <div style={{ background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:16, padding:"28px 24px" }}>
        <div style={{ fontSize:36, marginBottom:12 }}>📝</div>
        <h2 style={{ margin:"0 0 8px", fontSize:20 }}>Full Exam Simulator</h2>
        <p style={{ color:"var(--color-text-secondary)", fontSize:14, lineHeight:1.6, margin:"0 0 20px" }}>96 questions weighted to exam allocation. No feedback until the end.</p>
        <div style={{ background:"var(--color-background-secondary)", borderRadius:10, padding:"12px 14px", marginBottom:20 }}>
          {[["Continuity of Life","u4",19],["Evolution & Diversity","u5",29],["Life & Environment","u6",19],["Animal Behavior","u7",25],["Application","all",4]].map(([l,id,n])=>(
            <div key={l} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
              <div style={{ width:8, height:8, borderRadius:"50%", background:TOPIC_COLORS[id] }} />
              <span style={{ fontSize:13 }}>{l}</span>
              <span style={{ fontSize:11, color:"var(--color-text-tertiary)", marginLeft:"auto" }}>{n} Qs</span>
            </div>
          ))}
        </div>
        <button className="action-btn" onClick={start} style={{ width:"100%", background:"#1e293b", color:"#fff" }}>Generate and Start Exam</button>
      </div>
    </div>
  );

  if (phase==="exam") {
    const q = qs[idx]; if (!q) return null;
    return (
      <div style={{ maxWidth:600, margin:"0 auto", padding:"28px 20px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
          <div>
            <p style={{ margin:0, fontSize:13, fontWeight:500 }}>Question {idx+1} / {qs.length}</p>
            <p style={{ margin:0, fontSize:11, color:"var(--color-text-secondary)" }}>{q.section}</p>
          </div>
          <div style={{ textAlign:"right" }}>
            <p style={{ margin:0, fontSize:14, fontWeight:500, fontVariantNumeric:"tabular-nums" }}>{fmt(timer)}</p>
            <p style={{ margin:0, fontSize:11, color:"var(--color-text-secondary)" }}>{Object.keys(answers).length}/{qs.length} answered</p>
          </div>
        </div>
        <div className="progress-bar" style={{ marginBottom:20 }}>
          <div className="progress-fill" style={{ width:`${(idx/qs.length)*100}%`, background:"#1e293b" }} />
        </div>
        <div style={{ background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:14, padding:"20px 18px", marginBottom:16 }}>
          <p style={{ fontSize:15, fontWeight:500, margin:0, lineHeight:1.6 }}>{q.q}</p>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
          {["A","B","C","D"].map(opt=>{
            const isSel = answers[idx]===opt;
            return (
              <button key={opt} className="opt-btn" onClick={()=>setAnswers(a=>({...a,[idx]:opt}))}
                style={{ borderColor:isSel?"#1e293b":"var(--color-border-tertiary)", background:isSel?"#f1f5f9":"var(--color-background-primary)" }}>
                <span style={{ fontWeight:600, color:isSel?"#1e293b":"var(--color-text-secondary)", minWidth:20, fontSize:13 }}>{opt}</span>
                <span style={{ fontSize:14 }}>{q.options?.[opt] || ""}</span>
              </button>
            );
          })}
        </div>
        <div style={{ display:"flex", gap:10 }}>
          {idx>0 && <button className="action-btn" onClick={()=>setIdx(i=>i-1)} style={{ background:"var(--color-background-secondary)", color:"var(--color-text-primary)", border:"0.5px solid var(--color-border-tertiary)" }}>Back</button>}
          {idx<qs.length-1
            ? <button className="action-btn" onClick={()=>setIdx(i=>i+1)} style={{ flex:1, background:"#1e293b", color:"#fff" }}>Next</button>
            : <button className="action-btn" onClick={finish} style={{ flex:1, background:"#16a34a", color:"#fff" }}>Submit Exam</button>}
        </div>
      </div>
    );
  }

  if (phase==="results") {
    const correct = qs.filter((q,i)=>answers[i]===q.answer).length;
    const pct = Math.round((correct/qs.length)*100);
    const bySection = {};
    qs.forEach((q,i)=>{
      const sec = q.section||"General";
      if (!bySection[sec]) bySection[sec]={correct:0,total:0};
      bySection[sec].total++;
      if (answers[i]===q.answer) bySection[sec].correct++;
    });
    return (
      <div style={{ maxWidth:600, margin:"0 auto", padding:"28px 20px" }}>
        <button className="back-btn" onClick={onBack} style={{ marginBottom:20 }}>Back</button>
        <div style={{ textAlign:"center", marginBottom:24 }}>
          <div style={{ fontSize:48, marginBottom:8 }}>{pct>=70?"🏆":pct>=55?"👍":"📚"}</div>
          <h2 style={{ margin:"0 0 4px", fontSize:22 }}>{correct}/{qs.length} Correct</h2>
          <p style={{ color:"var(--color-text-secondary)", margin:"0 0 4px" }}>{pct}% -- {fmt(timer)} elapsed</p>
        </div>
        <h3 style={{ fontSize:14, fontWeight:500, color:"var(--color-text-secondary)", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:12 }}>Breakdown by Section</h3>
        <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
          {Object.entries(bySection).map(([sec,{correct:c,total}])=>{
            const p = Math.round((c/total)*100);
            const bc = p>=70?"#16a34a":p>=50?"#d97706":"#dc2626";
            return (
              <div key={sec} style={{ background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:10, padding:"10px 14px" }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                  <span style={{ fontSize:13, fontWeight:500 }}>{sec}</span>
                  <span style={{ fontSize:12, color:bc, fontWeight:500 }}>{c}/{total} ({p}%)</span>
                </div>
                <div className="progress-bar"><div className="progress-fill" style={{ width:`${p}%`, background:bc }} /></div>
              </div>
            );
          })}
        </div>
        <div style={{ display:"flex", gap:10, marginBottom:12 }}>
          <button className="action-btn" onClick={()=>setPhase("setup")} style={{ flex:1, background:"#1e293b", color:"#fff" }}>Retake</button>
          <button className="action-btn" onClick={()=>setShowReview(r=>!r)} style={{ flex:1, background:"var(--color-background-secondary)", color:"var(--color-text-primary)", border:"0.5px solid var(--color-border-tertiary)" }}>{showReview?"Hide":"Review"} Answers</button>
        </div>
        {showReview && qs.map((q,i)=>{
          const ok = answers[i]===q.answer;
          return (
            <div key={i} style={{ padding:"10px 14px", borderRadius:10, background:ok?"#f0fdf4":"#fff7f7", border:`0.5px solid ${ok?"#86efac":"#fca5a5"}`, marginBottom:8 }}>
              <div style={{ fontSize:13, fontWeight:500, marginBottom:4 }}>{i+1}. {q.q}</div>
              <div style={{ fontSize:12, color:"#16a34a" }}>Correct: {q.answer}</div>
              {!ok && <div style={{ fontSize:12, color:"#dc2626" }}>Your answer: {answers[i]||"skipped"}</div>}
            </div>
          );
        })}
      </div>
    );
  }
  return null;
}

// ── CHAT ─────────────────────────────────────────────────────────────────────
function ChatView({ topic, onBack }) {
  const col = TOPIC_COLORS[topic] || "#6366f1";
  const topicLabel = TOPICS.find(t=>t.id===topic)?.label;
  const [msgs, setMsgs]     = useState([{ role:"ai", text:`Hi! Ask me anything about ${topicLabel} from your lecture slides.` }]);
  const [input, setInput]   = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  const scroll = () => bottomRef.current?.scrollIntoView({ behavior:"smooth" });

  async function send() {
    const txt = input.trim(); if (!txt||loading) return;
    setMsgs(m=>[...m,{role:"user",text:txt}]); setInput(""); setLoading(true);
    const res = await callClaude(
      `Student question: ${txt}\n\nAnswer based ONLY on this lecture content:\n${topicKB(topic)}`,
      "You are a biology tutor. Answer strictly based on the provided lecture slides."
    );
    setMsgs(m=>[...m,{role:"ai",text:res}]); setLoading(false);
    setTimeout(scroll, 50);
  }

  const suggestions = ["Mitosis vs meiosis?","Explain Hardy-Weinberg","Batesian vs Mullerian mimicry?","Aplysia habituation mechanism?","fru gene in Drosophila?","Classical vs operant conditioning?"];

  return (
    <div style={{ maxWidth:600, margin:"0 auto", padding:"28px 20px", display:"flex", flexDirection:"column", height:"100vh", boxSizing:"border-box" }}>
      <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16, flexShrink:0 }}>
        <button className="back-btn" onClick={onBack}>Back</button>
        <div style={{ flex:1 }}>
          <h2 style={{ margin:0, fontSize:17, fontWeight:500 }}>Ask Claude</h2>
          <p style={{ margin:0, fontSize:12, color:"var(--color-text-secondary)" }}>Strictly based on lecture content</p>
        </div>
      </div>
      {msgs.length<=1 && (
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:14, flexShrink:0 }}>
          {suggestions.slice(0,4).map(sg=>(
            <button key={sg} className="chip" onClick={()=>setInput(sg)}
              style={{ background:"var(--color-background-secondary)", color:"var(--color-text-secondary)", borderColor:"var(--color-border-tertiary)", fontSize:11 }}>{sg}</button>
          ))}
        </div>
      )}
      <div style={{ flex:1, overflowY:"auto", display:"flex", flexDirection:"column", gap:12, marginBottom:14 }}>
        {msgs.map((m,i)=><div key={i} className={m.role==="user"?"chat-bubble-user":"chat-bubble-ai"}>{m.text}</div>)}
        {loading && <div className="chat-bubble-ai" style={{ color:"var(--color-text-secondary)" }}>Thinking...</div>}
        <div ref={bottomRef} />
      </div>
      <div style={{ display:"flex", gap:8, flexShrink:0 }}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()}
          placeholder="Ask about the lecture content..."
          style={{ flex:1, padding:"10px 14px", borderRadius:10, border:"0.5px solid var(--color-border-secondary)", background:"var(--color-background-primary)", fontSize:14, color:"var(--color-text-primary)" }} />
        <button className="action-btn" onClick={send} disabled={loading||!input.trim()} style={{ background:col, color:"#fff", padding:"10px 16px" }}>Send</button>
      </div>
    </div>
  );
}


// ── STUDY ALL ────────────────────────────────────────────────────────────────
function StudyAllView({ topic, onBack }) {
  const col = TOPIC_COLORS[topic] || "#6366f1";
  const topicLabel = TOPICS.find(t=>t.id===topic)?.label || "All Topics";
  const subsections = getSubsections(topic);
  const [phase, setPhase]     = useState("setup");
  const [allQ, setAllQ]       = useState([]);
  const [progress, setProgress] = useState({ done:0, total:0, current:"" });
  const [qIdx, setQIdx]       = useState(0);
  const [sel, setSel]         = useState(null);
  const [score, setScore]     = useState(0);
  const [results, setResults] = useState([]);
  const abortRef              = useRef(false);

  async function startGeneration() {
    abortRef.current = false;
    setPhase("generating"); setAllQ([]); setQIdx(0); setSel(null); setScore(0); setResults([]);
    setProgress({ done:0, total:subsections.length, current:"" });
    let acc = [];
    for (let i = 0; i < subsections.length; i++) {
      if (abortRef.current) break;
      const sub = subsections[i];
      setProgress({ done:i, total:subsections.length, current:sub.name });
      try {
        const raw = await callClaude(
          `Generate exactly 8 multiple-choice questions covering ONLY this content.\nSECTION: ${sub.name}\nCONTENT: ${sub.focus}\nReturn ONLY valid JSON (no markdown): [{"q":"...","options":{"A":"...","B":"...","C":"...","D":"..."},"answer":"A","section":"${sub.name}","explanation":"..."}]`,
          "Return only a valid JSON array. No markdown, no explanation outside the JSON."
        );
        const match = raw.match(/\[[\s\S]*\]/);
        if (match) { const parsed = JSON.parse(match[0]); acc = [...acc, ...parsed]; setAllQ([...acc]); }
      } catch(e) { console.error("Section failed:", sub.name, e); }
      setProgress({ done:i+1, total:subsections.length, current:sub.name });
      await new Promise(r => setTimeout(r, 800));
    }
    if (acc.length === 0) { setPhase("setup"); return; }
    setPhase("quiz");
  }

  function pick(opt) {
    if (sel) return;
    const q = allQ[qIdx];
    const ok = opt === q.answer;
    setSel(opt);
    if (ok) setScore(s=>s+1);
    setResults(r=>[...r,{ q:q.q, sel:opt, correct:q.answer, ok, section:q.section, explanation:q.explanation }]);
  }

  function next() {
    if (qIdx+1>=allQ.length) setPhase("results");
    else { setQIdx(i=>i+1); setSel(null); }
  }

  if (phase==="setup") return (
    <div style={{ maxWidth:600, margin:"0 auto", padding:"28px 20px" }}>
      <button className="back-btn" onClick={onBack} style={{ marginBottom:20 }}>Back</button>
      <div style={{ background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:16, padding:"28px 24px" }}>
        <div style={{ fontSize:36, marginBottom:12 }}>🔬</div>
        <h2 style={{ margin:"0 0 8px", fontSize:20 }}>Study All: {topicLabel}</h2>
        <p style={{ color:"var(--color-text-secondary)", fontSize:14, lineHeight:1.6, margin:"0 0 20px" }}>
          {subsections.length} sections, ~8 questions each = up to {subsections.length*8} questions with instant feedback.
        </p>
        <div style={{ background:"var(--color-background-secondary)", borderRadius:10, padding:"12px 14px", marginBottom:20 }}>
          {subsections.map((s,i)=>(
            <div key={i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
              <div style={{ width:6, height:6, borderRadius:"50%", background:col }} />
              <span style={{ fontSize:12, color:"var(--color-text-secondary)" }}>{s.name}</span>
            </div>
          ))}
        </div>
        <button className="action-btn" onClick={startGeneration} style={{ width:"100%", background:col, color:"#fff" }}>Start Study All</button>
      </div>
    </div>
  );

  if (phase==="generating") {
    const pct = progress.total>0 ? Math.round((progress.done/progress.total)*100) : 0;
    return (
      <div style={{ maxWidth:480, margin:"0 auto", padding:"60px 20px", textAlign:"center" }}>
        <div style={{ fontSize:36, marginBottom:16 }}>🔬</div>
        <h3 style={{ margin:"0 0 8px" }}>Generating Questions</h3>
        <p style={{ color:"var(--color-text-secondary)", fontSize:14, marginBottom:24 }}>Section {progress.done} of {progress.total}...</p>
        <div className="progress-bar" style={{ maxWidth:300, margin:"0 auto 10px" }}>
          <div className="progress-fill" style={{ width:`${pct}%`, background:col }} />
        </div>
        <p style={{ fontSize:12, color:"var(--color-text-tertiary)", marginBottom:12 }}>{pct}% complete</p>
        {progress.current && <div style={{ background:"var(--color-background-secondary)", borderRadius:10, padding:"10px 14px", fontSize:13, color:"var(--color-text-secondary)" }}>Generating: <strong style={{ color:"var(--color-text-primary)" }}>{progress.current}</strong></div>}
        {allQ.length>0 && <p style={{ fontSize:12, color:"var(--color-text-tertiary)", marginTop:12 }}>{allQ.length} questions ready</p>}
      </div>
    );
  }

  if (phase==="quiz") {
    const q = allQ[qIdx]; if (!q) return null;
    return (
      <div style={{ maxWidth:620, margin:"0 auto", padding:"28px 20px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
          <div>
            <p style={{ margin:0, fontSize:13, fontWeight:500 }}>Question {qIdx+1} / {allQ.length}</p>
            <p style={{ margin:0, fontSize:11, color:"var(--color-text-tertiary)" }}>{q.section}</p>
          </div>
          <div style={{ textAlign:"right" }}>
            <p style={{ margin:0, fontSize:13, fontWeight:500, color:col }}>{score} correct</p>
            <p style={{ margin:0, fontSize:11, color:"var(--color-text-tertiary)" }}>{qIdx>0?Math.round((score/qIdx)*100):0}% so far</p>
          </div>
        </div>
        <div className="progress-bar" style={{ marginBottom:16 }}>
          <div className="progress-fill" style={{ width:`${Math.round((qIdx/allQ.length)*100)}%`, background:col }} />
        </div>
        <div style={{ marginBottom:12 }}>
          <span style={{ fontSize:11, fontWeight:500, padding:"3px 10px", borderRadius:6, background:"var(--color-background-secondary)", color:"var(--color-text-secondary)" }}>{q.section}</span>
        </div>
        <div style={{ background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:14, padding:"20px 18px", marginBottom:16 }}>
          <p style={{ fontSize:15, fontWeight:500, margin:0, lineHeight:1.65 }}>{q.q}</p>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
          {["A","B","C","D"].map(opt=>{
            let cls = "opt-btn";
            if (sel) { if (opt===q.answer) cls+=" opt-correct"; else if (opt===sel) cls+=" opt-wrong"; }
            return (
              <button key={opt} className={cls} onClick={()=>pick(opt)}>
                <span style={{ fontWeight:600, color:sel?(opt===q.answer?"#16a34a":opt===sel?"#dc2626":"var(--color-text-tertiary)"):col, minWidth:20, fontSize:13 }}>{opt}</span>
                <span style={{ fontSize:14 }}>{q.options?.[opt]||""}</span>
              </button>
            );
          })}
        </div>
        {sel && (
          <div style={{ padding:"12px 14px", borderRadius:10, marginBottom:14, fontSize:13, lineHeight:1.55, background:sel===q.answer?"#f0fdf4":"#fff7f7", border:`0.5px solid ${sel===q.answer?"#86efac":"#fca5a5"}` }}>
            <strong style={{ color:sel===q.answer?"#16a34a":"#dc2626" }}>{sel===q.answer?"Correct!":"Incorrect -- answer is "+q.answer}</strong>
            {q.explanation && <p style={{ margin:"4px 0 0", color:"var(--color-text-secondary)" }}>{q.explanation}</p>}
          </div>
        )}
        {sel && <button className="action-btn" onClick={next} style={{ width:"100%", background:col, color:"#fff", fontSize:15, padding:12 }}>{qIdx+1>=allQ.length?"See Results":"Next Question"}</button>}
      </div>
    );
  }

  if (phase==="results") {
    const total = allQ.length;
    const pct = Math.round((score/total)*100);
    const bySection = {};
    results.forEach(r=>{
      if (!bySection[r.section]) bySection[r.section]={correct:0,total:0,wrong:[]};
      bySection[r.section].total++;
      if (r.ok) bySection[r.section].correct++;
      else bySection[r.section].wrong.push(r.q);
    });
    return (
      <div style={{ maxWidth:620, margin:"0 auto", padding:"28px 20px" }}>
        <button className="back-btn" onClick={onBack} style={{ marginBottom:20 }}>Back</button>
        <div style={{ textAlign:"center", padding:"20px 0 24px" }}>
          <div style={{ fontSize:52, marginBottom:10 }}>{pct>=80?"🏆":pct>=65?"👍":pct>=50?"📖":"💪"}</div>
          <h2 style={{ margin:"0 0 4px", fontSize:26, fontWeight:700 }}>{score} / {total}</h2>
          <p style={{ margin:"0 0 4px", fontSize:16, color:col, fontWeight:500 }}>{pct}%</p>
          <p style={{ margin:0, color:"var(--color-text-secondary)", fontSize:14 }}>{pct>=80?"Excellent -- thoroughly covered!":pct>=65?"Good work! Review weak sections.":pct>=50?"Keep going -- focus on weak sections.":"More review needed -- read summaries first."}</p>
        </div>
        <p style={{ fontSize:12, fontWeight:500, color:"var(--color-text-secondary)", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:12 }}>Breakdown by Section</p>
        <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:24 }}>
          {Object.entries(bySection).map(([section,data])=>{
            const sp = Math.round((data.correct/data.total)*100);
            const bc = sp>=80?"#16a34a":sp>=60?"#d97706":"#dc2626";
            return (
              <div key={section} style={{ background:"var(--color-background-primary)", border:"0.5px solid var(--color-border-tertiary)", borderRadius:10, padding:"12px 14px" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                  <span style={{ fontSize:13, fontWeight:500 }}>{section}</span>
                  <span style={{ fontSize:12, fontWeight:500, color:bc }}>{data.correct}/{data.total} ({sp}%)</span>
                </div>
                <div className="progress-bar"><div className="progress-fill" style={{ width:`${sp}%`, background:bc }} /></div>
                {data.wrong.length>0 && data.wrong.map((wq,i)=>(
                  <p key={i} style={{ fontSize:11, color:"var(--color-text-secondary)", margin:"4px 0 0", paddingLeft:10, borderLeft:"2px solid #fca5a5" }}>{wq.length>80?wq.slice(0,80)+"...":wq}</p>
                ))}
              </div>
            );
          })}
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <button className="action-btn" onClick={()=>setPhase("setup")} style={{ flex:1, background:col, color:"#fff" }}>Try Again</button>
          <button className="action-btn" onClick={onBack} style={{ flex:1, background:"var(--color-background-secondary)", color:"var(--color-text-primary)", border:"0.5px solid var(--color-border-tertiary)" }}>Home</button>
        </div>
      </div>
    );
  }
  return null;
}

// ── APP ROOT ─────────────────────────────────────────────────────────────────

function App() {
  const [view,  setView]  = useState("home");
  const [topic, setTopic] = useState("all");

  return (
    <div style={{ fontFamily:"var(--font-sans)", minHeight:"100vh", padding:"0 0 60px" }}>
      <style>{CSS}</style>
      {view==="home"       && <HomeView view={view} setView={setView} topic={topic} setTopic={setTopic} />}
      {view==="studyall"   && <StudyAllView   topic={topic} onBack={()=>setView("home")} />}
      {view==="flashcards" && <FlashcardsView topic={topic} onBack={()=>setView("home")} />}
      {view==="mcq"        && <MCQView        topic={topic} onBack={()=>setView("home")} />}
      {view==="exam"       && <ExamView                     onBack={()=>setView("home")} />}
      {view==="summary"    && <SummaryView    topic={topic} onBack={()=>setView("home")} />}
      {view==="chat"       && <ChatView       topic={topic} onBack={()=>setView("home")} />}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
